    <head>
        <title>Rubric Render</title>

        <style>

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            .container {
                width: 90%;
                margin: 0 auto;
            }

            .icon {                             
                /* width: 1rem;
                height: 1rem; */

                width: var(--icon-size, 1rem);
                height: var(--icon-size, 1rem);
                display: block;                
            }

            .icon-button {
                border: none; box-shadow: none;
            }
            

            header 
            { 
                width: 100%; 
                padding: 0.5rem 0.25rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
                color:white;
                background-color: #2929f3;
            }

            h1 { margin: 0;  }

            .app-toolbar 
            {                
                color:currentColor;
                background-color: inherit;                 
                display: flex;
                align-items: center;
                gap: 0.5rem;  
                margin-right: 8px;                             
            }

            .app-toolbar-button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                background-color: none;
                color: inherit;
            }

            .app-toolbar-icon {
                background-color: #2929f3; 
                fill:white;
                --icon-size: 24px;
            }

           

            main {width: 100%; }

            .rubric-form { 
                margin: 2rem 0;
                width: 100%;
                border: 1px solid #d6d6d6;
                border-radius: 0.5rem;
                background-color: #f7f7f7;
                padding: 1rem;
            }

          
            .form-field {
                margin: 1rem;
            }

            .form-field-help {
                font-style: italic;
                padding-left: 0.5rem;
               
            }

            .rubric-form label {
                color: blue;
                margin-right: 0.5rem;
            }

            .form-submit-button {
                padding: 0.5rem;
                color: blue;
                margin-left: 1rem;
                font-weight: bold;
            }

            footer { border-top: 1px dimgrey solid; margin: 8px 0; width: 100%;}

            .copyright { color: dimgrey; text-align:center;}

        </style>

    </head>

        <div class="container">
         
            <header>
                <div class="app-title"><h1>Rubric Render</h1></div>
                <div class="app-toolbar">
                    <button id="show-help" class="icon-button" title="Show help.">
                        <span class="icon-wrapper">
                            <svg class="icon app-toolbar-icon" aria-hidden="true">
                                <use href="#icon-help"></use>
                            </svg>
                        </span>
                    </button>
                    <button id="show-about" class="icon-button" title="About this applicaiton">
                         <span class="icon-wrapper">
                            <svg class="icon app-toolbar-icon" aria-hidden="true">
                                <use href="#icon-info"></use>
                            </svg>
                        </span>
                    </button>
                </div>
            </header>

            <main>
                <section id="app-input">
                    <form class="rubric-form" id="rubric-form">

                        <div class="form-field">
                            <label for="file-upload">Choose a rubric XML file</label>
                            <input
                                id="file-upload"
                                name="file-upload"
                                type="file"
                                accept=".xml,text/xml,application/xml"
                                aria-describedby="file-help"
                                title="Select rubric XML file."
                                required
                            >
                            <p id="file-help" class="form-field-help">
                                Select a rubric file in XML format.
                            </p>
                        </div>

                        <div class="form-field">
                            <label for="output-type">Output type</label>
                            <select id="output-type" name="output-type" title="Select output format.">
                                <option value="html" selected>HTML</option>
                                <option value="markdown">Markdown</option>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="output-level">Start at header level</label>
                            <select id="output-level" name="output-level" title="Select output startng heading level.">
                                <option value="level1">Level 1</option>
                                <option value="level2" selected>Level 2</option>
                                <option value="level3" >Level 3</option>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="output-show-model">Show rubric model</label>
                            <input id="output-show-model" name="output-show-model" type="checkbox" title="Select whether to show the parsed parsed rubric model (in a seperate section/window)." />                                
                        </div>                        

                        <button type="submit" class="form-submit-button">Generate output</button>

                        <div id="status" role="status" aria-live="polite"></div>
                    </form> 
                </section>

                <section id="app-output" class="app-output">
                    <div id="app-output-controls">
                        
                        <button type="button" id="copy-output" class="icon-button">
                            <span class="icon-wrapper">
                                <svg class="icon" aria-hidden="true">
                                    <use href="#icon-clipboard"></use>
                                </svg>
                            </span>
                        </button>
                        <button type="button" id="download-output" class="icon-butto">
                            <span class="icon-wrapper">
                                <svg class="icon" aria-hidden="true">
                                    <use href="#icon-download"></use>
                                </svg>
                            </span>
                        </button>
                    </div>

                    <div id="app-output-content">
                    </div>
                </section>           
            </main>

            <footer>
                <p class="copyright">Copyright &copy; April Daly</p>
            </footer>
          
        </div> <!-- container -->

                evt.preventDefault();

                const fileInput = document.getElementById("file-upload");
                const selectOutput = document.getElementById("output-type");

                const file = fileInput.files[0];
                const outputType = selectOutput.value;

                console.log(file);
                console.log(outputType);
            }

            window.addEventListener("DOMContentLoaded", function () {
                const form = document.getElementById("rubric-form");

                form.addEventListener("submit", submitForm);
            });

        </script>
